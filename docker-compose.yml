services:
  back:
    image: python:3
    working_dir: /app
    command: bash -c "pip3 install -r requirements.txt && python3 app.py"
    volumes:
      - ./back:/app
    environment:
      APP_ORIGIN_HOST: http://localhost:9000
      APP_HOST: 0.0.0.0
      FLASK_DEBUG: "1"
      # la clé est dans le .env (pas commité), voir .env.example
      STRIPE_API_KEY: ${STRIPE_API_KEY:?STRIPE_API_KEY must be set in .env}

  front:
    image: node:22
    working_dir: /app
    command: bash -c "npm install && npm run dev -- --host"
    volumes:
      - ./front:/app

  apache:
    image: httpd:latest
    ports:
      - 9000:80
    volumes:
      - ./apache/apache-dev.conf:/usr/local/apache2/conf/httpd.conf
    depends_on:
      - back
      - front
